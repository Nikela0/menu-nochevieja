<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Nochevieja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h1>Menú de Nochevieja</h1>

<label>Personas</label><br>
<input type="number" id="personas" value="4"><br><br>

<button onclick="generarMenu()">Generar menú</button>

<h2>Menú</h2>
<pre id="menu"></pre>

<h2>Receta principal</h2>
<pre id="receta"></pre>

<h2>Lista de la compra</h2>
<pre id="compra"></pre>

<script>
function generarMenu() {

  const menus = [
    {
      entrante: "Crema de calabaza",
      principal: "Lasaña de verduras",
      postre: "Mousse de chocolate",
      receta: 
`1. Sofríe cebolla y verduras.
2. Añade tomate triturado.
3. Monta capas con pasta y verduras.
4. Hornea 35 minutos a 180º.`,
      compra: [
        "Calabaza",
        "Cebolla",
        "Calabacín",
        "Berenjena",
        "Tomate triturado",
        "Placas de lasaña",
        "Chocolate negro",
        "Nata o bebida vegetal"
      ]
    },
    {
      entrante: "Hummus con verduras",
      principal: "Risotto de setas",
      postre: "Peras al horno",
      receta:
`1. Sofríe cebolla.
2. Añade arroz y caldo poco a poco.
3. Incorpora setas.
4. Remueve hasta cremoso.`,
      compra: [
        "Garbanzos",
        "Tahini",
        "Limón",
        "Arroz",
        "Setas",
        "Caldo vegetal",
        "Peras",
        "Canela"
      ]
    }
  ];

  const personas = document.getElementById("personas").value;
  const menu = menus[Math.floor(Math.random() * menus.length)];

  document.getElementById("menu").textContent =
`Para ${personas} personas

Entrante:
${menu.entrante}

Principal:
${menu.principal}

Postre:
${menu.postre}`;

  document.getElementById("receta").textContent = menu.receta;
  document.getElementById("compra").textContent =
    menu.compra.map(i => "- " + i).join("\n");
}
</script>

</body>
</html>
